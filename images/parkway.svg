<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Pattern for grid -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)"/>
  <rect width="800" height="450" fill="url(#gridPattern)"/>
  
  <!-- Browser Window Mockup -->
  <g transform="translate(100, 60)">
    <!-- Browser Chrome -->
    <rect x="0" y="0" width="600" height="330" rx="12" fill="url(#cardGradient)" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="600" height="40" rx="12" fill="#f1f5f9"/>
    
    <!-- Browser Buttons -->
    <circle cx="20" cy="20" r="6" fill="#ef4444"/>
    <circle cx="40" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="20" r="6" fill="#10b981"/>
    
    <!-- Address Bar -->
    <rect x="80" y="12" width="200" height="16" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="90" y="23" font-family="Inter, sans-serif" font-size="10" fill="#64748b">parkwayai.vercel.app</text>
    
    <!-- Content Area -->
    <rect x="20" y="60" width="560" height="250" rx="8" fill="#ffffff"/>
    
    <!-- Header/Nav Bar -->
    <rect x="20" y="60" width="560" height="50" fill="#1e40af"/>
    <text x="40" y="90" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff">PARKWAY</text>
    
    <!-- Search Bar -->
    <rect x="40" y="130" width="520" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="60" cy="150" r="8" fill="#3b82f6"/>
    <text x="80" y="155" font-family="Inter, sans-serif" font-size="14" fill="#94a3b8">Search for parking...</text>
    
    <!-- Property Cards -->
    <g transform="translate(40, 190)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="160" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="10" y="10" width="140" height="50" rx="4" fill="#e0e7ff"/>
      <text x="80" y="75" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Driveway</text>
      <text x="80" y="90" font-family="Inter, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">$15/hr</text>
      
      <!-- Card 2 -->
      <rect x="180" y="0" width="160" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="190" y="10" width="140" height="50" rx="4" fill="#dbeafe"/>
      <text x="260" y="75" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Parking</text>
      <text x="260" y="90" font-family="Inter, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">$12/hr</text>
      
      <!-- Card 3 -->
      <rect x="360" y="0" width="160" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="370" y="10" width="140" height="50" rx="4" fill="#e0f2fe"/>
      <text x="440" y="75" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Garage</text>
      <text x="440" y="90" font-family="Inter, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">$20/hr</text>
    </g>
  </g>
  
  <!-- Tech Stack Badges -->
  <g transform="translate(100, 400)">
    <rect x="0" y="0" width="70" height="30" rx="15" fill="#61dafb" opacity="0.2"/>
    <text x="35" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#61dafb" text-anchor="middle">React</text>
    
    <rect x="80" y="0" width="70" height="30" rx="15" fill="#000000" opacity="0.2"/>
    <text x="115" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">Next.js</text>
    
    <rect x="160" y="0" width="90" height="30" rx="15" fill="#336791" opacity="0.2"/>
    <text x="205" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#336791" text-anchor="middle">PostgreSQL</text>
    
    <rect x="260" y="0" width="70" height="30" rx="15" fill="#ff9900" opacity="0.2"/>
    <text x="295" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ff9900" text-anchor="middle">AWS</text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="30" fill="rgba(255,255,255,0.1)"/>
  <circle cx="750" cy="400" r="40" fill="rgba(255,255,255,0.08)"/>
</svg>

